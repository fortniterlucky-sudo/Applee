<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .menu {
            display: flex;
            gap: 30px;
            justify-content: center;
            padding: 15px;
            font-size: 12px;
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .main {
            display: flex;
            flex-direction: row;
            gap: 40px;
            max-width: 900px;
            width: 100%;
        }

        .big {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .small {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .big p {
            font-size: 24px;
            margin: 0;
        }

        .small p {
            font-size: 12px;
            margin: 0;
        }

        .title {
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="menu">
    <a href="#"></a>
    <a href="#">Store</a>
    <a href="#">Mac</a>
    <a href="#">iPad</a>
    <a href="#">iPhone</a>
    <a href="#">Watch</a>
    <a href="#">AirPods</a>
    <a href="#">Support</a>
    <a href="#">🔍</a>
    <a href="#">🧺</a>
</div>

<div class="main-wrapper">
    <div class="main">
        <div class="big">
            <p class="title">Shop</p>
            <p>Shop the Latest</p>
            <p>Mac</p>
            <p>iPad</p>
            <p>iPhone</p>
            <p>Apple Watch</p>
            <p>AirPods</p>
        </div>
        <div class="small">
            <p class="title">Quick Links</p>
            <p>Find a Store</p>
            <p>Order Status</p>
            <p>Apple Trade In</p>
            <p>Financing</p>
        </div>
        <div class="small">
            <p class="title">Special Stores</p>
            <p>Education</p>
            <p>Business</p>
            <p>Government</p>
        </div>
    </div>
</div>

</body>
</html>
